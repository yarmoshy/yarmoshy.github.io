<style>
  :root {
    --ink: #2B2233; --muted: #6E6478; --bg: #FFF7EE; --card: #FFFFFF;
    --orange: #E8730C; --purple: #5B2F91; --line: #E6DCD0; --bad: #B3261E;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #F3ECF8; --muted: #B7AAC4; --bg: #1A1420; --card: #251D2D;
      --orange: #F28C2E; --purple: #B48CE8; --line: #3A2F45; --bad: #FF8A80; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", Verdana, system-ui, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .gate { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; }
  .card {
    width: min(100%, 24rem); background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 32px 28px; display: grid; gap: 16px; text-align: center;
  }
  .candies { display: flex; justify-content: center; gap: 10px; }
  .candies svg { width: 34px; height: 34px; }
  h1 { margin: 0; font-size: 1.75rem; }
  p { margin: 0; color: var(--muted); line-height: 1.45; }
  form { display: grid; gap: 10px; }
  input {
    font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); text-align: center;
  }
  input:focus-visible, button:focus-visible, a.btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  button, a.btn {
    font: inherit; font-weight: 700; font-size: 1rem; padding: 12px 18px; border-radius: 12px;
    border: 0; background: var(--purple); color: #fff; cursor: pointer; text-decoration: none; display: inline-block;
  }
  @media (prefers-color-scheme: dark) { button, a.btn { color: #1A1420; } }
  a.btn.alt { background: var(--orange); }
  button[disabled] { opacity: .6; cursor: wait; }
  .err { color: var(--bad); font-weight: 700; min-height: 1.4em; }
  .viewer { display: grid; gap: 12px; padding-block: 16px; max-width: 60rem; margin-inline: auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .bar h1 { font-size: 1.4rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  iframe { width: 100%; height: calc(100vh - 110px); min-height: 480px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
</style>
</head>

const KEY = 'candy-report-pw';

const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));

async function decrypt(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
}

function show(bytes) {
  const url = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
  document.getElementById('pdf').src = url;
  document.getElementById('open').href = url;
  document.getElementById('save').href = url;
  document.getElementById('gate').hidden = true;
  document.getElementById('viewer').hidden = false;
}

async function tryUnlock(password, quiet) {
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  go.disabled = true;
  err.textContent = '';
  try {
    show(await decrypt(password));
    try { localStorage.setItem(KEY, password); } catch (e) {}
  } catch (e) {
    try { localStorage.removeItem(KEY); } catch (e2) {}
    if (!quiet) err.textContent = "That password isn't right. Try again.";
  } finally {
    go.disabled = false;
  }
}

document.getElementById('unlock').addEventListener('submit', (ev) => {
  ev.preventDefault();
  tryUnlock(document.getElementById('pw').value, false);
});

let saved = null;
try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) tryUnlock(saved, true);
</script>
